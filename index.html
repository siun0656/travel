<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이 가자! 여행 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EC; --paper:#FFFFFF; --ink:#4A3B36; --soft:#8C7B74;
  --pink:#F9C6D3; --pink-d:#EE8FA8; --blue:#BEDDF0; --blue-d:#6FA3C7;
  --orange:#F6B27A; --yellow:#FFE9A8; --green:#CFE8C0; --line:#EFE3D2;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 12px 12px,#FBE9D3 2px,transparent 2.5px);background-size:36px 36px}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--pink-d)}
input[type=checkbox],input[type=radio]{width:auto}
input[type=date],input[type=time],input[type=datetime-local]{min-width:0;font-size:14px;padding:9px 8px}
.row>input{min-width:0}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(255,248,236,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;border-bottom:2px dashed var(--line)}
.top .ttl{flex:1;min-width:0;font-family:'Jua';font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meb{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--yellow);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);flex:none}
.av.s{width:22px;height:22px}
main{flex:1;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(255,255,255,.96);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:8px 0 7px;font-size:11px;color:var(--soft);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .e{font-size:21px;line-height:1.1;filter:grayscale(.6);transition:transform .15s}
nav button.on{color:var(--ink);font-weight:700}
nav button.on .e{filter:none;transform:translateY(-2px) scale(1.12)}
nav .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--pink-d);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.blue{background:var(--blue)}.btn.yellow{background:var(--yellow)}.btn.green{background:var(--green)}
.btn.ghost{background:#fff;box-shadow:none;border-color:var(--line);font-weight:500}
.btn.sm{padding:4px 12px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost.sm{box-shadow:none}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.chip.on{background:var(--yellow);border-color:var(--orange)}
.muted{color:var(--soft);font-size:13px}
.empty{text-align:center;color:var(--soft);padding:22px 10px}
.empty img{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 6px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:26px}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* login */
#login{max-width:460px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px 40px}
#login h1{font-size:34px;margin:6px 0 2px;text-align:center}
#login .sub{text-align:center;color:var(--soft);margin-bottom:14px}
.hero-st{display:block;margin:0 auto;width:120px;height:120px;object-fit:contain;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.hero-st{animation:none}}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:150px;overflow:auto;padding:4px}
.avgrid button{border-radius:14px;border:2px solid transparent;padding:2px;background:#fff}
.avgrid button.on{border-color:var(--pink-d);background:var(--pink)}
.avgrid img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px}
label.f{display:block;font-weight:700;margin:10px 0 4px;font-size:13px}
/* home */
.hero{background:linear-gradient(135deg,var(--pink),var(--yellow));border:2px solid var(--ink);border-radius:26px;padding:16px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 0 var(--ink)}
.hero h2{margin:0;font-size:26px}
.hero .dest{font-size:15px;margin-top:2px}
.hero .when{margin-top:10px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:8px 12px;display:inline-block}
.hero img.deco{position:absolute;right:6px;bottom:4px;width:92px;height:92px;object-fit:contain}
.members{display:flex;flex-wrap:wrap;gap:8px}
.mem{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.code{font-family:'Jua';letter-spacing:3px;font-size:22px;background:#fff;border:2px dashed var(--pink-d);border-radius:14px;padding:4px 12px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead .m{font-family:'Jua';font-size:20px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:12px;color:var(--soft)}
.dow div:first-child,.d.sun .n{color:#E0708A}
.dow div:last-child,.d.sat .n{color:var(--blue-d)}
.d{aspect-ratio:1/1.08;border-radius:12px;border:2px solid var(--line);background:#fff;position:relative;padding:3px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.d.blank{border:0;background:none}
.d .n{font-size:12px;font-weight:700}
.d .c{font-size:10px;align-self:flex-end;font-weight:700}
.d .mk{position:absolute;right:3px;top:3px;font-size:10px}
.d.today{border-color:var(--ink)}
.d.fix{border-color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange)}
.d.mine::after{content:"✓";position:absolute;left:3px;bottom:2px;font-size:10px;color:var(--pink-d);font-weight:700}
.d.past{opacity:.45}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(74,59,54,.42)}
#sheet .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--cream);border-radius:26px 26px 0 0;border:2px solid var(--ink);border-bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sheet .box{animation:none}}
#sheet h3{margin:0 0 6px;font-size:20px}
/* chat */
#tab-chat{padding-bottom:70px}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:7px 12px;white-space:pre-wrap;word-break:break-word}
.msg.me .bub{background:var(--pink);border-color:var(--pink-d);border-radius:18px 18px 6px 18px}
.nm{font-size:11px;color:var(--soft);margin:0 4px 2px}
.msg.me .nm{text-align:right}
.tm{font-size:10px;color:var(--soft);white-space:nowrap}
.stk{width:116px;height:116px;object-fit:contain}
.day{align-self:center;font-size:11px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 10px;color:var(--soft)}
#chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:28;background:var(--cream);border-top:2px dashed var(--line)}
#chatbar .in{max-width:560px;margin:0 auto;padding:8px 12px}
#chatbar form{display:flex;gap:6px}
#chatbar input{border-radius:999px}
.sq{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:20px;flex:none}
#picker{height:250px;overflow:auto;padding:4px 0 8px}
.ptabs{display:flex;gap:6px;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pgrid button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:3px;aspect-ratio:1}
.pgrid button:active{background:var(--yellow)}
.pgrid img{width:100%;height:100%;object-fit:contain}
.pgrid.em{grid-template-columns:repeat(8,1fr)}
.pgrid.em button{font-size:22px;aspect-ratio:auto;padding:4px 0}
/* poll */
.opt{position:relative;border:2px solid var(--line);border-radius:14px;margin:6px 0;overflow:hidden;background:#fff;width:100%;text-align:left;display:block}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--blue);opacity:.55;transition:width .3s}
.opt.sel{border-color:var(--pink-d)}.opt.sel .bar{background:var(--pink)}
.opt .t{position:relative;padding:9px 12px;display:flex;justify-content:space-between;gap:8px}
.opt .who{position:relative;padding:0 12px 8px;font-size:12px;color:var(--soft)}
.opt:disabled{cursor:default}
.lk{display:block;text-decoration:none;color:inherit}
.lk .ic{width:42px;height:42px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:22px;flex:none}
.lk .u{font-size:12px;color:var(--blue-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi{display:flex;gap:10px;padding:8px 0;border-top:2px dotted var(--line)}
.pi:first-of-type{border-top:0}
.pi .tt{font-family:'Jua';min-width:46px;color:var(--pink-d)}
.x{color:var(--soft);font-size:16px;padding:2px 6px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;z-index:90;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#err{background:#FFE1E1;border:2px solid #E88;border-radius:14px;margin:10px 14px;padding:8px 12px;font-size:13px}

.seg{display:flex;gap:6px;margin-bottom:12px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;padding:6px 0;border-radius:999px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--pink);color:var(--ink)}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);padding:0;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lk2{position:absolute;right:4px;bottom:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:0 7px;font-size:11px}
img.big{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:14px;background:#fff;border:2px solid var(--line)}
.rxs{display:flex;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:3px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 7px;font-size:12px;margin:3px 3px 0 0}
.rx.on{background:var(--yellow);border-color:var(--orange)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 12px;text-align:left;box-shadow:0 3px 0 var(--line)}
.menu button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.menu .e{font-size:32px;display:block;margin-bottom:2px}
.notice{background:var(--yellow);border-color:var(--orange)}
.wx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wx>div{flex:none;text-align:center;background:var(--cream);border-radius:14px;padding:6px 8px;min-width:64px;font-size:12px}
.wx .i{font-size:24px}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink-d);border-radius:999px;transition:width .3s}
.ck{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:2px dotted var(--line)}
.ck input{width:22px;height:22px;accent-color:var(--pink-d);flex:none}
.ck.done .tx{text-decoration:line-through;color:var(--soft)}
label.chip input{margin:0}
a.btn{text-decoration:none;display:inline-block}

.cd{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;vertical-align:middle}
.colgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.colb{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colb.on{box-shadow:0 0 0 3px var(--ink)}
.colb.used{opacity:.3;display:grid;place-items:center;font-size:12px}
.colb.used::after{content:'🔒'}
.colmsg{margin-top:8px;background:#FFF1F4;border:2px solid var(--pink-d);border-radius:14px;padding:8px 12px;font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:8px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 .5px rgba(74,59,54,.3)}
.dots .more{font-size:9px;color:var(--soft)}
.d.free{box-shadow:inset 0 0 0 2px #8CCB7A;background-color:#F1FAEA}
.d.fix{box-shadow:inset 0 0 0 2px var(--orange)}
.d.mine::after{left:auto;right:3px;top:2px;bottom:auto}
button.ttl{text-align:left;color:inherit;padding:0}
.roomcard{width:100%;text-align:left;display:flex;gap:10px;align-items:center;margin-bottom:8px}
</style>
</head>
<body>
<div id="err" class="hidden"></div>

<!-- 로그인 -->
<section id="login" class="hidden">
  <button class="btn ghost sm hidden" id="btnBackApp" type="button">← 원래 방으로 돌아가기</button>
  <img id="heroSt" class="hero-st" alt="">
  <h1>같이 가자! ✈️</h1>
  <div class="sub">친구들과 일정·투표·대화를 한곳에서</div>
  <div class="card">
    <label class="f" for="inNick">내 이름 (별명)</label>
    <input id="inNick" maxlength="10" placeholder="예: 시니나" autocomplete="off">
    <label class="f">프로필 스티커</label>
    <div id="avGrid" class="avgrid"></div>
    <label class="f">내 색깔 <span class="muted" style="font-weight:400">(달력에 내 일정이 이 색으로 표시돼요)</span></label>
    <div id="colGrid" class="colgrid"></div>
    <div id="colMsg" class="colmsg hidden" role="alert"></div>
  </div>
  <div class="card">
    <h3>🔑 여행방 코드로 입장</h3>
    <div class="row"><input id="inCode" maxlength="8" placeholder="여행방 코드" autocapitalize="characters" autocomplete="off"><button class="btn blue" id="btnJoin" style="white-space:nowrap;flex:none">입장</button></div>
  </div>
  <div class="card hidden" id="restoreCard">
    <h3>🙋 이미 있던 친구라면?</h3>
    <div class="muted" style="margin-bottom:8px">내 이름을 누르면 예전 프로필·색깔 그대로 바로 다시 들어가요. (기기를 바꾸거나 브라우저가 초기화돼도 OK!)</div>
    <div id="restoreList" class="members"></div>
  </div>
  <div class="card">
    <h3>🌸 새 여행방 만들기</h3>
    <input id="inTitle" maxlength="30" placeholder="여행 이름 (예: 부산 겨울 여행)">
    <div style="height:8px"></div>
    <button class="btn" id="btnNew" style="width:100%">여행방 만들기</button>
  </div>
</section>

<!-- 앱 -->
<div id="app" class="hidden">
  <header class="top">
    <button class="ttl" id="topTitle" aria-label="여행방 바꾸기">여행방 ▾</button>
    <div class="meb"><img class="av" id="meAv" alt=""><span id="meNick"></span></div>
  </header>
  <main>
    <section class="tab on" id="tab-home"></section>
    <section class="tab" id="tab-sched"><div class="seg" id="segSched"><button data-sv="date" class="on">📅 날짜</button><button data-sv="plan">🗺️ 계획</button></div><div id="vDate"></div><div id="vPlan" class="hidden"></div></section>
    <section class="tab" id="tab-poll"></section>
    <section class="tab" id="tab-chat"><div class="msgs" id="msgs"></div></section>
    <section class="tab" id="tab-album"></section>
    <section class="tab" id="tab-more"></section>
  </main>
  <button class="fab hidden" id="fab" aria-label="추가">＋</button>
</div>

<div id="chatbar" class="hidden"><div class="in">
  <div id="pickerWrap" class="hidden">
    <div class="ptabs">
      <button class="chip on" data-pt="mj">먼작귀</button>
      <button class="chip" data-pt="my">우리 스티커</button>
      <button class="chip" data-pt="em">이모지</button>
    </div>
    <div id="picker"></div>
  </div>
  <form id="chatForm" autocomplete="off">
    <button type="button" class="sq" id="btnPick" aria-label="스티커">😀</button>
    <input id="chatIn" placeholder="메시지를 입력해요" maxlength="500">
    <button class="btn sm" style="padding:8px 14px;white-space:nowrap;flex:none">전송</button>
  </form>
</div></div>

<nav id="nav" class="hidden"><div class="in">
  <button data-t="home" class="on"><span class="e">🏠</span>홈</button>
  <button data-t="sched"><span class="e">📅</span>일정</button>
  <button data-t="poll"><span class="e">🗳️</span>투표<span class="bd hidden" id="bdPoll"></span></button>
  <button data-t="chat"><span class="e">💬</span>대화<span class="bd hidden" id="bdChat"></span></button>
  <button data-t="album"><span class="e">📸</span>앨범<span class="bd hidden" id="bdAlbum"></span></button>
  <button data-t="more"><span class="e">🧺</span>더보기<span class="bd hidden" id="bdMore"></span></button>
</div></nav>

<div id="sheet" class="hidden"><div class="box" id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="fileSt" accept="image/*" class="hidden">
<input type="file" id="filePh" accept="image/*" multiple class="hidden">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

function colorOf(n){const c=(S.members[n]||{}).color;return c||hashCol(n)}
const COLNAMES=['코랄','주황','노랑','초록','민트','파랑','남보라','보라','핑크','갈색','회색','빨강'];
const colName=c=>COLNAMES[PALETTE.indexOf(c)]||'이 색';
const ro=w=>{const ch=w.charCodeAt(w.length-1)-0xAC00;return(ch>=0&&ch%28!==0&&ch%28!==8)?'으로':'로'};
const colMsg=(c,n)=>`${n}님이 ${colName(c)}${ro(colName(c))} 이미 들어왔어용~ 다른 색 골라 주세욥 🎨`;
function colWarn(c,n){const el=$('#colMsg');if(!el)return;if(!c){el.classList.add('hidden');return}el.textContent=colMsg(c,n);el.classList.remove('hidden')}
let loginUsed={},roomMem=null,usedT=null;
function drawCol(){$('#colGrid').innerHTML=PALETTE.map(c=>`<button type="button" class="colb ${c===pickedCol?'on':''} ${loginUsed[c]?'used':''}" data-c="${c}" style="background:${c}" aria-label="${loginUsed[c]?esc(loginUsed[c])+'님이 사용 중':'색깔 선택'}"></button>`).join('')}
function recomputeUsed(){
  const nick=safeKey($('#inNick').value.trim());loginUsed={};
  Object.entries(roomMem||{}).forEach(([n,v])=>{if(n!==nick&&v&&v.color)loginUsed[v.color]=n});
  drawCol();if(loginUsed[pickedCol])colWarn(pickedCol,loginUsed[pickedCol]);else colWarn();
  renderRestore();
}
function fetchRoomMem(){
  const code=$('#inCode').value.trim().toUpperCase();
  if(code.length<4||!db){roomMem=null;recomputeUsed();return}
  db.ref(`rooms/${code}/members`).get().then(s=>{roomMem=s.val()||{};recomputeUsed()},()=>{});
}

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeKey=s=>String(s||'').replace(/[.#$\[\]\/\s]/g,'').slice(0,10);
const pad=n=>String(n).padStart(2,'0');
const fmtD=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const DOW=['일','월','화','수','목','금','토'];
const todayStr=()=>{const t=new Date();return fmtD(t.getFullYear(),t.getMonth(),t.getDate())};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const niceD=s=>{if(!s)return'';const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const sk=src=>typeof src==='string'&&src.startsWith('data:image/')?src:'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- 여러 방 관리 ---------- */
function getRooms(){
  let r=[];try{r=JSON.parse(localStorage.getItem('trip.rooms')||'[]')}catch(_){}
  if(!r.length){try{const s=JSON.parse(localStorage.getItem('trip.session')||'null');if(s&&s.code&&s.nick){r=[{code:s.code,nick:s.nick,av:s.av,col:s.col}];localStorage.setItem('trip.rooms',JSON.stringify(r))}}catch(_){}}
  return r;
}
function saveRoom(o){
  const old=getRooms().find(r=>r.code===o.code)||{},m=Object.assign({},old,o);
  localStorage.setItem('trip.rooms',JSON.stringify([m,...getRooms().filter(r=>r.code!==o.code)].slice(0,20)));
  localStorage.setItem('trip.session',JSON.stringify(m));
}
function updRoom(code,p){const rs=getRooms(),i=rs.findIndex(r=>r.code===code);if(i<0)return;if(Object.keys(p).every(k=>rs[i][k]===p[k]))return;Object.assign(rs[i],p);localStorage.setItem('trip.rooms',JSON.stringify(rs))}
function removeRoom(code){
  localStorage.setItem('trip.rooms',JSON.stringify(getRooms().filter(r=>r.code!==code)));
  try{const s=JSON.parse(localStorage.getItem('trip.session')||'null');if(s&&s.code===code)localStorage.removeItem('trip.session')}catch(_){}
}
const iyo=n=>{const c=String(n).charCodeAt(String(n).length-1)-0xAC00;return(c>=0&&c%28===0)?'예요':'이에요'};

}

async function enter(code,nick){
  S.code=code;S.me=nick;S.av=pickedAv;
  let conflict=null;
  try{const ms=(await R('members').get()).val()||{};Object.entries(ms).forEach(([n,v])=>{if(n!==nick&&v&&v.color===pickedCol)conflict=n})}catch(_){}
  if(conflict){S.code=null;S.me=null;fetchRoomMem();colWarn(pickedCol,conflict);toast(colMsg(pickedCol,conflict));return}
  saveRoom({code,nick,av:pickedAv,col:pickedCol});
  history.replaceState(null,'','#'+code);
  await R('members/'+nick).update({av:pickedAv,color:pickedCol,joined:firebase.database.ServerValue.TIMESTAMP});
  if(window.__sw){location.reload();return}
  startApp();
}

/* ---------- 날짜 ---------- */
const addDays=(ds,n)=>{const d=parseD(ds);d.setDate(d.getDate()+n);return fmtD(d.getFullYear(),d.getMonth(),d.getDate())};
const covers=(e,d)=>e.date<=d&&d<=(e.end||e.date);
let freeMin=2;
let timedBusy=true;
const evAll=e=>e.allDay!==false;
const evTime=e=>(e.end&&e.end!==e.date?'':(evAll(e)?'하루종일':`${e.st||''}${e.et?'~'+e.et:''}`));
function busyMap(){
  const m={};
  vals(S.events).forEach(e=>{
    if(!e.date||!S.members[e.nick])return;
    const all=evAll(e);let ds=e.date;const end=e.end||e.date;
    for(let i=0;i<60&&ds<=end;i++){const mm=(m[ds]=m[ds]||new Map());mm.set(e.nick,mm.get(e.nick)===true||all);ds=addDays(ds,1)}
  });
  return m;
}
const isBusy=mm=>!!(mm&&mm.size&&(timedBusy||[...mm.values()].some(v=>v)));
function freeRuns(minLen){
  const busy=busyMap(),runs=[],td=todayStr(),H=180;
  let start=null,last=null;
  for(let i=0;i<=H;i++){
    const ds=addDays(td,i),free=!isBusy(busy[ds]);
    if(free){if(!start)start=ds;last=ds}
    else if(start){runs.push({s:start,e:last,n:Math.round((parseD(last)-parseD(start))/864e5)+1,open:false});start=null}
  }
  if(start)runs.push({s:start,e:last,n:Math.round((parseD(last)-parseD(start))/864e5)+1,open:true});
  return runs.filter(r=>r.n>=minLen);
}
function dotsHtml(mm){
  const a=[...mm.entries()],show=a.slice(0,5);
  return show.map(([n,all])=>{const c=colorOf(n);return `<i class="dot" title="${esc(n)}${all?'':' (시간 일정)'}" style="${all?`background:${c}`:`background:#fff;box-shadow:inset 0 0 0 2px ${c}`}"></i>`}).join('')+(a.length>5?`<span class="more">+${a.length-5}</span>`:'');
}
function renderDate(){
  const {y,m}=cal,first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),nm=Object.keys(S.members).length||1;
  const c=S.meta.confirmed,td=todayStr(),busy=busyMap(),anyEv=Object.keys(S.events).length>0;
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="d blank"></div>';
  for(let d=1;d<=last;d++){
    const ds=fmtD(y,m,d),a=S.avail[ds]||{},cnt=Object.keys(a).length,dow=(first+d-1)%7;
    const fix=c&&c.start&&ds>=c.start&&ds<=(c.end||c.start);

const WX={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',56:'🌧️',57:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};

function paintWx(data){
  const box=$('#wxBox');if(!box)return;
  const w=data.w,c=S.meta.confirmed;let idx=[],label='앞으로 7일',note='';
  if(c&&c.start){w.time.forEach((d,i)=>{if(d>=c.start&&d<=(c.end||c.start))idx.push(i)});if(idx.length)label='여행 기간';else if(c.start>w.time[w.time.length-1])note='<div class="muted" style="margin-top:6px">여행일이 예보 범위(16일)보다 멀어서 가까운 날씨를 보여줘요.</div>'}

async function loadWeather(){
  const box=$('#wxBox');if(!box)return;
  const dest=(S.meta.dest||'').trim();
  if(!dest){box.textContent='목적지를 정하면 날씨를 보여줘요. (홈의 “여행 정보 수정”에서 입력)';return}
  const ck='trip.wx.'+dest;let cached=null;
  try{cached=JSON.parse(sessionStorage.getItem(ck)||'null')}catch(_){}
  if(cached&&Date.now()-cached.t<36e5){paintWx(cached.d);return}
  if(wxBusy)return;wxBusy=true;
  try{
    const geo=async q=>(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ko`)).json();
    let g=await geo(dest);
    if(!g.results){const alt=dest.replace(/(특별자치도|광역시|특별시|도|시|군)$/,'');if(alt&&alt!==dest)g=await geo(alt)}
    if(!g.results)throw new Error('nf');
    const {latitude:la,longitude:lo,name}=g.results[0];
    const w=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`)).json();
    const data={name,w:w.daily};
    try{sessionStorage.setItem(ck,JSON.stringify({t:Date.now(),d:data}))}catch(_){}
    paintWx(data);
  }catch(_){const b=$('#wxBox');if(b)b.textContent='날씨를 불러오지 못했어요. 목적지 이름을 더 간단히(예: 제주) 적어 보세요.'}
  finally{wxBusy=false}
}

/* ---------- 정산 ---------- */
function calcSplit(){
  const bal={};Object.keys(S.members).forEach(n=>bal[n]=0);let total=0;
  vals(S.expenses).forEach(e=>{
    const sp=Object.keys(e.split||{});if(!sp.length||!e.amount)return;
    total+=e.amount;bal[e.payer]=(bal[e.payer]||0)+e.amount;sp.forEach(n=>bal[n]=(bal[n]||0)-e.amount/sp.length);
  });
  const cr=[],de=[];
  Object.entries(bal).forEach(([n,v])=>{const r=Math.round(v);if(r>0)cr.push([n,r]);else if(r<0)de.push([n,-r])});
  cr.sort((a,b)=>b[1]-a[1]);de.sort((a,b)=>b[1]-a[1]);
  const tr=[];let i=0,j=0;
  while(i<cr.length&&j<de.length){const x=Math.min(cr[i][1],de[j][1]);if(x>0)tr.push({from:de[j][0],to:cr[i][0],amt:x});cr[i][1]-=x;de[j][1]-=x;if(!cr[i][1])i++;if(!de[j][1])j++}
  return{bal,total,tr};
}
function viewSplit(el){
  const {bal,total,tr}=calcSplit(),ex=sorted(S.expenses,(a,b)=>(b.date||'').localeCompare(a.date||'')||b.t-a.t),nm=Object.keys(S.members).length||1;
  const done=t=>{const s=S.settle[`${t.from}>${t.to}`];return s&&s.amt===t.amt};
  el.innerHTML=`<div class="card"><div class="jua" style="font-size:26px">${money(total)}</div><div class="muted">총 ${ex.length}건 · 1인 평균 약 ${money(total/nm)}</div></div>
  <div class="card"><h3>🤝 이렇게 보내면 끝!</h3>${tr.length?tr.map((t,i)=>`<div class="row" style="padding:6px 0;border-top:${i?'2px dotted var(--line)':'0'}">${avTiny(t.from)}<b>${esc(t.from)}</b> → ${avTiny(t.to)}<b>${esc(t.to)}</b><span class="grow" style="text-align:right"><b class="jua">${money(t.amt)}</b></span><button class="btn sm ${done(t)?'green':'ghost'}" data-st="${i}">${done(t)?'완료 ✔':'송금 완료'}</button></div>`).join(''):`<div class="muted">${ex.length?'정산할 금액이 없어요 🎉':'지출을 추가하면 자동으로 계산해요.'}</div>`}
    ${tr.length?'<button class="btn sm yellow" id="spCopy" style="margin-top:8px">정산 결과 복사</button>':''}</div>
  <div class="card"><h3>⚖️ 사람별 정리</h3>${Object.entries(bal).map(([n,v])=>{const r=Math.round(v);return `<div class="row" style="padding:4px 0">${avTiny(n)}<span class="grow">${esc(n)}</span><b style="color:${r>0?'var(--blue-d)':r<0?'#D9607E':'var(--soft)'}">${r>0?'+'+money(r)+' 받기':r<0?money(-r)+' 보내기':'정산 끝'}</b></div>`}).join('')}</div>
  <div class="card"><h3>🧾 지출 내역</h3>${ex.length?ex.map(e=>`<div class="pi"><div class="grow"><b>${esc(e.desc)}</b> <span class="chip on">${money(e.amount)}</span><div class="muted">${avTiny(e.payer)} ${esc(e.payer)} 결제 · ${Object.keys(e.split||{}).map(esc).join(', ')} · ${niceD(e.date)}</div></div>${(e.nick===S.me||e.payer===S.me)?`<button class="x" data-dex="${e.id}" aria-label="삭제">✕</button>`:''}</div>`).join(''):'<div class="muted">아직 지출이 없어요. 오른쪽 아래 ＋ 버튼으로 추가해요.</div>'}</div>`;
  $$('#mBody [data-st]').forEach(b=>b.onclick=()=>{const t=tr[+b.dataset.st],r=R(`settle/${t.from}>${t.to}`);done(t)?r.remove():r.set({amt:t.amt,t:Date.now()})});

  const cp=$('#spCopy');if(cp)cp.onclick=()=>{const txt=`💸 ${S.meta.title||'여행'} 정산\n`+tr.map(t=>`${t.from} → ${t.to}: ${money(t.amt)}`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('복사했어요'),()=>prompt('복사해 주세요',txt))};
}

  $('#pAddS').onclick=()=>sheetPack('shared');$('#pAddM').onclick=()=>sheetPack('mine');
}
function sheetPack(kind){
  kind=kind||'mine';
  openSheet(`<h3>🎒 준비물 추가</h3>
  <div class="row"><button class="chip ${kind==='shared'?'on':''}" id="kS">🧳 공용</button><button class="chip ${kind==='mine'?'on':''}" id="kM">🎒 내 것</button></div>
  <label class="f">물건 이름</label><input id="pI" maxlength="30" placeholder="${kind==='shared'?'예: 보드게임':'예: 보조배터리'}">
  ${kind==='shared'?'<div style="margin-top:8px"><label><input type="checkbox" id="pT"> 내가 챙길게요</label></div>':''}
  <div class="row" style="margin-top:14px"><button class="btn grow" id="pS">추가</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
  $('#kS').onclick=()=>sheetPack('shared');$('#kM').onclick=()=>sheetPack('mine');
  $('#pS').onclick=()=>{const text=$('#pI').value.trim();if(!text)return toast('물건 이름을 입력해 주세요');
    const d={kind,text,done:false,nick:S.me,t:Date.now()};if(kind==='mine')d.owner=S.me;else if($('#pT').checked)d.assignee=S.me;
    R('pack').push(d);closeSheet()};
}

/* ---------- 예산 ---------- */
const BCATS=[['move','🚗','교통'],['stay','🏨','숙소'],['food','🍜','식비'],['play','🎡','놀거리'],['etc','🛍️','기타']];
function viewBudget(el){
  const items=sorted(S.budget,(a,b)=>b.t-a.t),total=items.reduce((s,i)=>s+(i.amount||0),0),nm=Object.keys(S.members).length||1;
  const real=vals(S.expenses).reduce((s,e)=>s+(e.amount||0),0),by={};items.forEach(i=>by[i.cat]=(by[i.cat]||0)+(i.amount||0));
  el.innerHTML=`<div class="card"><h3>예상 예산</h3><div class="jua" style="font-size:28px">${money(total)}</div><div class="muted">1인당 약 ${money(total/nm)} (${nm}명 기준)</div>
  ${real?`<div style="margin-top:8px">실제 지출 ${money(real)} ${total?`<span class="chip ${real>total?'':'on'}">${real>total?`예산보다 ${money(real-total)} 초과`:`${money(total-real)} 남음`}</span>`:''}</div>`:''}</div>
  <div class="card"><h3>📊 분류별</h3>${BCATS.map(([k,e,n])=>{const v=by[k]||0;return `<div style="margin:8px 0"><div class="row"><span class="grow">${e} ${n}</span><b>${money(v)}</b></div><div class="prog"><i style="width:${total?v/total*100:0}%"></i></div></div>`}).join('')}</div>
  <div class="card"><h3>🧾 항목</h3>${items.length?items.map(i=>{const c=BCATS.find(b=>b[0]===i.cat)||BCATS[4];return `<div class="pi"><span style="font-size:20px">${c[1]}</span><div class="grow"><b>${esc(i.text)}</b><div class="muted">${esc(i.nick)}</div></div><b>${money(i.amount)}</b>${i.nick===S.me?`<button class="x" data-dbg="${i.id}" aria-label="삭제">✕</button>`:''}</div>`}).join(''):'<div class="muted">숙소, 교통, 식비처럼 예상 비용을 적어 보세요.</div>'}</div>`;
  $$('#mBody [data-dbg]').forEach(b=>b.onclick=()=>{if(confirm('이 항목을 지울까요?'))R('budget/'+b.dataset.dbg).remove()});
}
function sheetBudget(){
  openSheet(`<h3>💰 예산 항목 추가</h3>
  <label class="f">분류</label><select id="bC">${BCATS.map(([k,e,n])=>`<option value="${k}">${e} ${n}</option>`).join('')}</select>
  <label class="f">항목</label><input id="bT" maxlength="30" placeholder="예: 2박 숙소">
  <label class="f">예상 금액 (원, 전체 합계)</label><input id="bA" inputmode="numeric" placeholder="예: 240000">
  <div class="row" style="margin-top:14px"><button class="btn grow" id="bS">추가</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
  $('#bS').onclick=()=>{const text=$('#bT').value.trim(),amount=num($('#bA').value);if(!text||!amount)return toast('항목과 금액을 입력해 주세요');R('budget').push({cat:$('#bC').value,text,amount,nick:S.me,t:Date.now()});closeSheet()};
}

/* ---------- 칭찬 배지 · 한줄 후기 ---------- */
const BADGES=[['길치 대장','🧭'],['사진 장인','📸'],['맛집 요정','🍜'],['분위기 메이커','🎉'],['총무 천사','💸'],['운전 영웅','🚗'],['지각 요정','⏰'],['체력왕','💪'],['먹방 대장','🍚'],['막내 에너지','🐣'],['길 안내 달인','🗺️'],['잠꾸러기','😴']];
const bEmoji=k=>(BADGES.find(b=>b[0]===k)||[0,'🏅'])[1];
function viewBadge(el){
  const bs=sorted(S.badges,(a,b)=>b.t-a.t),mem=Object.keys(S.members),rv=S.reviews||{};
  const got=n=>{const c={};bs.filter(b=>b.to===n).forEach(b=>c[b.kind]=(c[b.kind]||0)+1);return c};
  el.innerHTML=`<div class="card"><h3>🏅 우리 배지 판</h3>${mem.map(n=>{const g=got(n),ks=Object.keys(g);return `<div class="row" style="padding:6px 0;align-items:flex-start"><img class="av" src="${avOf(n)}" alt=""><div class="grow"><b>${esc(n)}</b><div class="row wrap" style="margin-top:2px">${ks.length?ks.map(k=>`<span class="chip on">${bEmoji(k)} ${esc(k)}${g[k]>1?' ×'+g[k]:''}</span>`).join(''):'<span class="muted">아직 받은 배지가 없어요</span>'}</div></div></div>`}).join('')}
  <button class="btn sm" id="bgGive" style="margin-top:8px">🏅 친구에게 배지 주기</button></div>
  <div class="card"><h3>💌 최근 칭찬</h3>${bs.length?bs.slice(0,10).map(b=>`<div class="pi"><span style="font-size:22px">${bEmoji(b.kind)}</span><div class="grow"><b>${esc(b.from)}</b> → <b>${esc(b.to)}</b> <span class="chip">${esc(b.kind)}</span>${b.msg?`<div class="muted">${esc(b.msg)}</div>`:''}</div>${b.from===S.me?`<button class="x" data-dbd="${b.id}" aria-label="삭제">✕</button>`:''}</div>`).join(''):'<div class="muted">여행 중 고마웠던 친구에게 배지를 선물해 보세요.</div>'}</div>
  <div class="card"><h3>✍️ 여행 한줄 후기</h3>${Object.entries(rv).sort((a,b)=>(b[1].t||0)-(a[1].t||0)).map(([n,r])=>`<div class="pi"><img class="av" src="${avOf(n)}" alt=""><div class="grow"><b>${esc(n)}</b> <span>${'⭐'.repeat(Math.max(0,Math.min(5,r.stars||0)))}</span><div>${esc(r.text)}</div></div></div>`).join('')||'<div class="muted">아직 후기가 없어요.</div>'}
  <button class="btn sm yellow" id="rvEdit" style="margin-top:8px">${rv[S.me]?'내 후기 수정':'내 후기 쓰기'}</button></div>`;
  $('#bgGive').onclick=sheetBadge;$('#rvEdit').onclick=sheetReview;
  $$('#mBody [data-dbd]').forEach(b=>b.onclick=()=>{if(confirm('이 배지를 지울까요?'))R('badges/'+b.dataset.dbd).remove()});
}
function sheetBadge(){
  const others=Object.keys(S.members).filter(n=>n!==S.me);
  if(!others.length){toast('다른 친구가 입장하면 배지를 줄 수 있어요');return}
  let pick=BADGES[0][0];
  openSheet(`<h3>🏅 배지 주기</h3>
  <label class="f">누구에게?</label><select id="gT">${others.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
  <label class="f">어떤 배지?</label><div class="row wrap" id="gB">${BADGES.map(([k,e],i)=>`<button type="button" class="chip ${i===0?'on':''}" data-g="${k}">${e} ${k}</button>`).join('')}</div>
  <label class="f">한마디 (선택)</label><input id="gM" maxlength="60" placeholder="예: 덕분에 사진이 잘 나왔어!">
  <div class="row" style="margin-top:14px"><button class="btn grow" id="gS">배지 선물하기</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
  $('#gB').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;pick=b.dataset.g;$$('#gB .chip').forEach(x=>x.classList.toggle('on',x===b))};
  $('#gS').onclick=()=>{const to=$('#gT').value;R('badges').push({to,from:S.me,kind:pick,msg:$('#gM').value.trim(),t:Date.now()});
    R('chat').push({nick:'🔔',t:Date.now(),text:`${bEmoji(pick)} ${S.me}님이 ${to}님에게 “${pick}” 배지를 줬어요!`,sys:1});closeSheet();toast('배지를 선물했어요 🏅')};
}
function sheetReview(){
  const r=(S.reviews||{})[S.me]||{};let stars=r.stars||5;
  openSheet(`<h3>✍️ 여행 한줄 후기</h3>
  <div class="row" id="rvS">${[1,2,3,4,5].map(i=>`<button type="button" class="sq" data-s="${i}" aria-label="${i}점">${i<=stars?'⭐':'☆'}</button>`).join('')}</div>
  <label class="f">후기</label><textarea id="rvT" rows="3" maxlength="120" placeholder="예: 다음엔 제주도 가자!">${esc(r.text||'')}</textarea>
  <div class="row" style="margin-top:14px"><button class="btn grow" id="rvSave">저장</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
  $('#rvS').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;stars=+b.dataset.s;$$('#rvS .sq').forEach(x=>x.textContent=+x.dataset.s<=stars?'⭐':'☆')};
  $('#rvSave').onclick=()=>{const text=$('#rvT').value.trim();if(!text)return toast('후기를 적어 주세요');R('reviews/'+S.me).set({text,stars,t:Date.now()});closeSheet()};
}

/* ---------- 랜덤 뽑기 ---------- */
const RL={menu:['돼지국밥','밀면','회','해물탕','파스타','치킨','분식','카페 디저트'],pen:['노래 한 곡','커피 쏘기','애교 1분','막내 심부름','칭찬 3개 하기','사진 찍어주기']};
let rlText=RL.menu.join('\n'),rlName='점심 메뉴',rlRes='',rlIv=null;
const rlHtml=t=>`<div><img class="stk" src="${PACK[Math.floor(Math.random()*PACK.length)].src}" alt=""><div>${esc(t)}</div></div>`;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function viewRoulette(el){
  el.innerHTML=`<div class="card"><div class="row wrap"><button class="chip" data-rp="menu">🍜 메뉴</button><button class="chip" data-rp="pen">😈 벌칙</button><button class="chip" data-rp="mem">🙋 멤버</button><button class="chip" data-rp="ord">🔢 순서 정하기</button></div>
  <textarea id="rlT" rows="6" style="margin-top:8px" placeholder="한 줄에 하나씩 적어요">${esc(rlText)}</textarea></div>
  <div class="card" style="text-align:center"><div id="rlOut" class="jua" style="font-size:26px;min-height:150px;display:grid;place-items:center">${rlRes?rlHtml(rlRes):'<span class="muted" style="font-size:15px">버튼을 눌러 뽑아 보세요!</span>'}</div>
  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="rlGo">🎲 뽑기!</button><button class="btn blue" id="rlSh">대화방에 공유</button></div></div>`;
  const ta=$('#rlT');ta.oninput=()=>{rlText=ta.value;rlName='랜덤 뽑기'};
  $$('#mBody [data-rp]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.rp;
    if(k==='ord'){const o=shuffle(Object.keys(S.members));rlName='순서';rlRes=o.map((n,i)=>`${i+1}. ${n}`).join('\n');$('#rlOut').innerHTML=`<div style="white-space:pre-line;font-size:22px">${esc(rlRes)}</div>`;return}
    rlText=(k==='menu'?RL.menu:k==='pen'?RL.pen:Object.keys(S.members)).join('\n');rlName={menu:'점심 메뉴',pen:'벌칙',mem:'뽑힌 사람'}[k];ta.value=rlText;
  });
  $('#rlGo').onclick=()=>{
    const items=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);if(items.length<2)return toast('2개 이상 적어 주세요');
    const out=$('#rlOut'),fin=items[Math.floor(Math.random()*items.length)];
    const show=()=>{rlRes=fin;out.innerHTML=rlHtml(fin)};
    clearInterval(rlIv);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){show();return}
    let k=0;rlIv=setInterval(()=>{out.textContent=items[Math.floor(Math.random()*items.length)];if(++k>=14){clearInterval(rlIv);show()}},90);
  };
  $('#rlSh').onclick=()=>{if(!rlRes)return toast('먼저 뽑기를 해 주세요');sendChat({text:`🎲 ${rlName}: ${rlRes}`});toast('대화방에 공유했어요')};
}

/* ---------- 채팅 ---------- */
function scrollChat(f){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:f?'auto':'smooth'}))}
function sendChat(o){R('chat').push({nick:S.me,t:Date.now(),...o})}
$('#chatForm').onsubmit=e=>{e.preventDefault();const t=$('#chatIn').value.trim();if(!t)return;sendChat({text:t});$('#chatIn').value=''};
$('#btnPick').onclick=()=>{const w=$('#pickerWrap');w.classList.toggle('hidden');if(!w.classList.contains('hidden')){renderPicker();scrollChat()}};
$$('.ptabs .chip').forEach(b=>b.onclick=()=>{pickTab=b.dataset.pt;$$('.ptabs .chip').forEach(x=>x.classList.toggle('on',x===b));renderPicker()});
function renderPicker(){
  const p=$('#picker');if(!p)return;
  if(pickTab==='mj'){p.innerHTML=`<div class="pgrid">${PACK.map(s=>`<button data-st="${s.id}"><img src="${s.src}" alt="스티커"></button>`).join('')}</div>`}
  else if(pickTab==='my'){const ks=Object.entries(S.stickers).filter(([,v])=>sk(v.src));
    p.innerHTML=`<button class="btn sm blue" id="btnAddSt" style="margin-bottom:8px">＋ 내 스티커 추가</button><div class="muted" style="margin-bottom:6px">추가하면 우리 방 친구들 모두 쓸 수 있어요.</div><div class="pgrid">${ks.map(([k,v])=>`<button data-sk="${k}"><img src="${v.src}" alt="스티커"></button>`).join('')}</div>`;
    $('#btnAddSt').onclick=()=>$('#fileSt').click()}
  else p.innerHTML=`<div class="pgrid em">${EMOJI.map(e=>`<button data-em="${e}">${e}</button>`).join('')}</div>`;
}
$('#picker').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.st){sendChat({st:b.dataset.st});$('#pickerWrap').classList.add('hidden')}
  else if(b.dataset.sk){sendChat({sk:b.dataset.sk});$('#pickerWrap').classList.add('hidden')}
  else if(b.dataset.em){const i=$('#chatIn');i.value+=b.dataset.em;i.focus()}};
$('#fileSt').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    let src;
    if(f.type==='image/gif'&&f.size<90000)src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    else{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
      const sc=Math.min(1,160/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);src=cv.toDataURL('image/webp',.8);
      if(!src.startsWith('data:image/webp'))src=cv.toDataURL('image/jpeg',.8);
    }
    if(src.length>120000)return toast('이미지가 너무 커요. 더 작은 이미지를 골라 주세요');
    R('stickers').push({src,nick:S.me,t:Date.now()});toast('스티커를 추가했어요');
  }catch(_){toast('이미지를 불러오지 못했어요')}
};

/* ---------- 부팅 ---------- */
(function boot(){
  initLogin();
  const rooms=getRooms(),h=location.hash.replace('#','').toUpperCase(),last=JSON.parse(localStorage.getItem('trip.session')||'null');
  const cur=h?rooms.find(r=>r.code===h):(rooms.find(r=>r.code===(last||{}).code)||rooms[0]);
  if(cur&&db){
    S.code=cur.code;S.me=cur.nick;S.av=cur.av||pickedAv;pickedAv=S.av;pickedCol=cur.col||pickedCol;
    db.ref(`rooms/${S.code}/meta`).get().then(s=>{
      if(s.exists()){history.replaceState(null,'','#'+S.code);saveRoom(cur);R('members/'+S.me).update(Object.assign({av:S.av},cur.col?{color:cur.col}:{}));startApp()}
      else{removeRoom(cur.code);toast('없어진 여행방이에요');history.replaceState(null,'',location.pathname);setTimeout(()=>location.reload(),800)}
    },()=>{S.code=null;$('#login').classList.remove('hidden')});
  }else $('#login').classList.remove('hidden');
})();
</script>
